<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Pannello Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body.modal-open {
            overflow: hidden;
        }

        *,
        *::before,
        *::after {
        box-sizing: border-box;
        }
        body {
            font-family: system-ui;
            padding: 20px;
            background: black;
            color: white;
        }

        h1,
        h2 {
            margin-bottom: 10px;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 6px;
        }

        .btn-primary {
            background: #38bdf8;
            color: #000;
        }

        .btn-danger {
            background: #ef4444;
            color: #fff;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, .15);
            text-align: left;
        }

        th {
            opacity: .8;
        }

        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
        }

        .modal-box {
            background: #020617;
            padding: 20px;
            border-radius: 10px;
            max-width: 420px;
            margin: 80px auto;
        }

        .modal-box input,
        .modal-box select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .admin-filters {
            margin: 14px 0 10px;
        }

        .admin-filters select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.25);
            background: rgba(255,255,255,.08);
            color: #fff;
            font-weight: 600;
        }

        /* FIX leggibilità SELECT + OPTIONS */
        select {
            background-color: #020617;
            color: #ffffff;
        }

        select option {
            background-color: #020617;
            color: #ffffff;
        }

        /* quando un'opzione è selezionata */
        select option:checked {
            background-color: #38bdf8;
            color: #020617;
        }

        /* hover (supportato da alcuni browser) */
        select option:hover {
            background-color: #1e293b;
            color: #ffffff;
        }

        .admin-filters input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.25);
            background: #020617;
            color: #fff;
            font-weight: 600;
            margin-right: 8px;
        }

        /* ===============================
        ADMIN TABLE – MOBILE CLEAN
        ================================ */
        @media (max-width: 768px) {

        /* nascondi colonne inutili */
        table th:nth-child(1),
        table td:nth-child(1), /* Img */

        table th:nth-child(4),
        table td:nth-child(4), /* Categoria */

        table th:nth-child(5),
        table td:nth-child(5), /* Espansione */

        table th:nth-child(6),
        table td:nth-child(6), /* Quantità */

        table th:nth-child(7),
        table td:nth-child(7)  /* Visibile */ {
            display: none;
        }

        table {
            font-size: 14px;
        }

        td, th {
            padding: 8px 6px;
            vertical-align: middle;
        }

        /* Nome più leggibile */
        table td:nth-child(2) {
            font-weight: 700;
        }

        /* Prezzo compatto */
        table td:nth-child(3) {
            white-space: nowrap;
            font-weight: 600;
        }

        /* Azioni */
        table td:nth-child(8) button {
            padding: 6px 8px;
            font-size: 14px;
            margin-right: 4px;
        }
        }

        /* ===============================
   MODAL UPGRADE
=============================== */

#modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(4px);
}

.modal-box {
    background: #0f172a;
    padding: 30px;
    border-radius: 16px;
    max-width: 600px;
    margin: 60px auto;
    box-shadow: 0 20px 50px rgba(0,0,0,.6);
    animation: fadeUp .2s ease-out;
}

.modal-box h3 {
    margin-bottom: 20px;
    font-size: 20px;
    font-weight: 700;
}

/* Grid layout */
.modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.modal-full {
    grid-column: span 2;
}

.modal-box input,
.modal-box select,
.modal-box textarea {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.15);
    background: #020617;
    color: #fff;
    font-size: 14px;
    transition: .2s ease;
}

.modal-box input:focus,
.modal-box select:focus,
.modal-box textarea:focus {
    border-color: #38bdf8;
    outline: none;
    box-shadow: 0 0 0 2px rgba(56,189,248,.3);
}

/* Image preview */
.image-preview {
    width: 100%;
    height: 120px;
    border-radius: 10px;
    background: #020617;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.1);
}

.image-preview img {
    max-height: 100%;
    max-width: 100%;
}

.modal-actions {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===============================
   TOGGLE SWITCH
=============================== */

.switch-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 14px;
}

.switch {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 24px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #334155;
    border-radius: 24px;
    transition: .25s;
}

.slider:before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    top: 3px;
    background-color: white;
    border-radius: 50%;
    transition: .25s;
}

.switch input:checked + .slider {
    background-color: #38bdf8;
}

.switch input:checked + .slider:before {
    transform: translateX(22px);
}

/* ===============================
   MYSTERY PREMIUM CARD
=============================== */

.mystery-card {
    margin-top: 20px;
    max-width: 750px;
    background: linear-gradient(145deg, #0f172a, #020617);
    border: 1px solid rgba(56,189,248,.25);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,.6);
}

.mystery-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.field {
    display: flex;
    flex-direction: column;
}

.field.full {
    grid-column: span 2;
}

.field label {
    font-size: 12px;
    opacity: .6;
    margin-bottom: 6px;
    letter-spacing: .5px;
}

.mystery-card input,
.mystery-card textarea {
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.1);
    background: #020617;
    color: #fff;
    font-size: 14px;
    transition: .2s ease;
}

.mystery-card input:focus,
.mystery-card textarea:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 0 2px rgba(56,189,248,.3);
}

.mystery-card textarea {
    min-height: 90px;
    resize: vertical;
}

.mystery-actions {
    margin-top: 25px;
    display: flex;
    justify-content: flex-end;
}

@media (max-width: 768px) {

    body {
        padding: 12px;
    }

  .mystery-card {
    width: 100%;
    max-width: 500px;   /* non 100% */
    padding: 18px;
  }

  .mystery-grid {
    grid-template-columns: 1fr;
  }

  .field.full {
    grid-column: span 1;
  }

  .mystery-actions {
    justify-content: stretch;
  }

  .mystery-actions button {
    width: 100%;
  }

  html, body {
  overflow-x: hidden;
}
}

#mysterySection {
  display: flex;
  justify-content: center;
}

.modal-box {
    max-height: 85vh;
    overflow-y: auto;
}

@media (max-width: 768px) {
  .modal-box {
    margin: 20px;
    max-height: 90vh;
  }
}

.upload-zone {
    border: 2px dashed rgba(255,255,255,.25);
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    background: #020617;
    transition: .2s ease;
}

.upload-zone.dragover {
    border-color: #38bdf8;
    background: rgba(56,189,248,.1);
}
    </style>
</head>

<body>

        <button class="btn-danger" onclick="logout()">Logout</button>
    </div>

    <hr>    

    <div style="margin-bottom:20px; display:flex; gap:10px;">

    <!-- EVENT MODAL -->
    <div id="eventModal"
        style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(4px);">

            <h3 id="eventModalTitle">Nuovo Evento</h3>

    <script src="app.js"></script>

    <script>

        let currentView = "catalog";


        /*************************************************
         * WAIT FOR SUPABASE CLIENT READY
         *************************************************/
        function waitForSupabase(callback) {
            const check = setInterval(() => {
                if (window.supabaseClient) {
                    clearInterval(check);
                    callback();
                }
            }, 50);
        }

        /*************************************************
         * INIT
         *************************************************/
        waitForSupabase(async () => {

            const { data: { session } } =
                await window.supabaseClient.auth.getSession();

            if (!session) {
                window.location.replace("admin-login.html");
                return;
            }

            initAdmin();
        });


        function setView(view) {

                currentView = view;

                const catalogSection = document.getElementById("catalogSection");
                const mysterySection = document.getElementById("mysterySection");
                const eventsSection = document.getElementById("eventsSection");

                catalogSection.style.display = "none";
                mysterySection.style.display = "none";
                eventsSection.style.display = "none";

                document.getElementById("viewCatalogBtn").classList.remove("btn-primary");
                document.getElementById("viewMysteryBtn").classList.remove("btn-primary");
                document.getElementById("viewEventsBtn").classList.remove("btn-primary");

                if (view === "catalog") {
                    catalogSection.style.display = "block";
                    document.getElementById("viewCatalogBtn").classList.add("btn-primary");
                    loadProducts();
                }

                if (view === "mystery") {
                    mysterySection.style.display = "block";
                    document.getElementById("viewMysteryBtn").classList.add("btn-primary");
                    loadMystery();
                }

                if (view === "events") {
                    eventsSection.style.display = "block";
                    document.getElementById("viewEventsBtn").classList.add("btn-primary");
                    loadEvents();
                }
            }

        
        async function loadEvents() {

                const { data, error } = await window.supabaseClient
                    .from("events")
                    .select("*")
                    .order("created_at", { ascending: false });

                if (error) {
                    console.error(error);
                    return;
                }

                const tbody = document.getElementById("eventsTable");
                tbody.innerHTML = "";

                data.forEach(e => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
            <td>${e.title}</td>
            <td>${new Date(e.event_date).toLocaleString()}</td>
            <td>${e.is_active ? "🔥 ATTIVO" : "-"}</td>
            <td>
                <button onclick="editEvent('${e.id}')">✏️</button>
                ${!e.is_active ? `<button onclick="activateEvent('${e.id}')">⚡ Attiva</button>` : ""}
                <button onclick="deleteEvent('${e.id}')" style="background:#ef4444;color:white;">🗑</button>
            </td>
        `;

                    tbody.appendChild(row);
                });
            }

        async function activateEvent(id) {

                // Disattiva tutti
                await window.supabaseClient
                    .from("events")
                    .update({ is_active: false })
                    .neq("id", id);

                // Attiva quello selezionato
                const { error } = await window.supabaseClient
                    .from("events")
                    .update({ is_active: true })
                    .eq("id", id);

                if (error) {
                    console.error(error);
                    alert("Errore attivazione evento");
                    return;
                }

                loadEvents();
            }

        async function deleteEvent(id) {
                if (!confirm("Eliminare evento?")) return;

                await window.supabaseClient
                    .from("events")
                    .delete()
                    .eq("id", id);

                loadEvents();
            }  
            
        function openEventModal() {
                document.getElementById("eventId").value = "";
                document.getElementById("eventModalTitle").innerText = "Nuovo Evento";

                document.getElementById("eventTitle").value = "";
                document.getElementById("eventSubtitle").value = "";
                document.getElementById("eventDescription").value = "";
                document.getElementById("eventDate").value = "";
                document.getElementById("eventCtaText").value = "";
                document.getElementById("eventCtaLink").value = "";
                document.getElementById("eventImage").value = "";
                document.getElementById("eventActive").checked = false;

                document.getElementById("eventModal").style.display = "block";
            }

            function closeEventModal() {
                document.getElementById("eventModal").style.display = "none";
            }

            async function editEvent(id) {

                const { data, error } = await window.supabaseClient
                    .from("events")
                    .select("*")
                    .eq("id", id)
                    .single();

                if (error) {
                    console.error(error);
                    return;
                }

                document.getElementById("eventModalTitle").innerText = "Modifica Evento";
                document.getElementById("eventId").value = data.id;
                document.getElementById("eventTitle").value = data.title || "";
                document.getElementById("eventSubtitle").value = data.subtitle || "";
                document.getElementById("eventDescription").value = data.description || "";
                document.getElementById("eventDate").value = data.event_date
                    ? new Date(data.event_date).toISOString().slice(0, 16)
                    : "";
                document.getElementById("eventCtaText").value = data.cta_text || "";
                document.getElementById("eventCtaLink").value = data.cta_link || "";
                document.getElementById("eventImage").value = data.image_url || "";
                document.getElementById("eventActive").checked = data.is_active;

                document.getElementById("eventModal").style.display = "block";
            }

            async function saveEvent() {

                    const id = document.getElementById("eventId").value;

                    const payload = {
                        title: document.getElementById("eventTitle").value.trim(),
                        subtitle: document.getElementById("eventSubtitle").value.trim(),
                        description: document.getElementById("eventDescription").value.trim(),
                        event_date: document.getElementById("eventDate").value,
                        cta_text: document.getElementById("eventCtaText").value.trim(),
                        cta_link: document.getElementById("eventCtaLink").value.trim(),
                        image_url: document.getElementById("eventImage").value.trim(),
                        is_active: false  
                    };

                    if (!payload.title || !payload.event_date) {
                        alert("Titolo e Data sono obbligatori");
                        return;
                    }

                    let savedId;
                    let error;

                    if (id) {
                        const { data, error: updateError } = await window.supabaseClient
                            .from("events")
                            .update(payload)
                            .eq("id", id)
                            .select()
                            .single();

                        error = updateError;
                        savedId = data?.id;

                    } else {
                        const { data, error: insertError } = await window.supabaseClient
                            .from("events")
                            .insert(payload)
                            .select()
                            .single();

                        error = insertError;
                        savedId = data?.id;
                    }

                    if (error) {
                        console.error(error);
                        alert("Errore salvataggio evento");
                        return;
                    }

                    // Se attivo → usa funzione ufficiale
                    const shouldActivate = document.getElementById("eventActive").checked;

                    if (shouldActivate && savedId) {
                        await window.supabaseClient.rpc("activate_event", {
                            event_id: savedId
                        });
                    }

                    closeEventModal();
                    loadEvents();
                }
        /*************************************************
         * INIT ADMIN
         *************************************************/
        function initAdmin() {
            loadProducts();
            loadMystery();
        }

        async function loadMystery() {

                const { data, error } = await window.supabaseClient
                    .from("products")
                    .select("*")
                    .eq("is_mystery", true)
                    .single();

                if (error || !data) {
                    console.log("Nessuna mystery trovata");
                    return;
                }

                const rewardsContainer = document.getElementById("rewardsList");
                rewardsContainer.innerHTML = "";

                (data.mystery_rewards || []).forEach(r => {
                    addRewardField(r);
                });
                document.getElementById("mysteryName").value = data.name || "";
                document.getElementById("mysteryDesc").value = data.description || "";
                document.getElementById("mysteryPrice").value = data.price || 0;
                document.getElementById("mysteryMin").value = data.mystery_min_value || "";
                document.getElementById("mysteryMax").value = data.mystery_max_value || "";
                document.getElementById("mysteryBanner").value = data.image || "";
            }

        function addRewardField(value = "") {

                const container = document.getElementById("rewardsList");

                const wrapper = document.createElement("div");
                wrapper.style.display = "flex";
                wrapper.style.gap = "8px";
                wrapper.style.marginBottom = "8px";

                const input = document.createElement("input");
                input.type = "text";
                input.value = value;
                input.style.flex = "1";

                const removeBtn = document.createElement("button");
                removeBtn.innerText = "✖";
                removeBtn.style.background = "#ef4444";
                removeBtn.style.color = "white";
                removeBtn.onclick = () => wrapper.remove();

                wrapper.appendChild(input);
                wrapper.appendChild(removeBtn);

                container.appendChild(wrapper);
            }

        async function saveMystery() {

                const rewardInputs = document.querySelectorAll("#rewardsList input");
                const rewards = [];

                rewardInputs.forEach(input => {
                    if (input.value.trim() !== "") {
                        rewards.push(input.value.trim());
                    }
                });

                const payload = {
                    name: document.getElementById("mysteryName").value,
                    description: document.getElementById("mysteryDesc").value,
                    price: parseFloat(document.getElementById("mysteryPrice").value) || 0,
                    mystery_min_value: parseFloat(document.getElementById("mysteryMin").value) || 0,
                    mystery_max_value: parseFloat(document.getElementById("mysteryMax").value) || 0,
                    mystery_rewards: rewards,
                    image: document.getElementById("mysteryBanner").value,
                    is_mystery: true,
                    product_type: "mystery",
                    visible: true
                };

                // cerca se esiste già una mystery speciale
                const { data: existing } = await window.supabaseClient
                    .from("products")
                    .select("id")
                    .eq("is_mystery", true)
                    .maybeSingle();

                let error;

                if (existing) {
                    // aggiorna quella esistente
                    ({ error } = await window.supabaseClient
                        .from("products")
                        .update(payload)
                        .eq("id", existing.id));
                } else {
                    // crea nuova
                    ({ error } = await window.supabaseClient
                        .from("products")
                        .insert(payload));
                }

                if (error) {
                    console.error(error);
                    alert("Errore salvataggio Mystery");
                    return;
                }

                alert("Mystery speciale salvata!");
            }
        /*************************************************
         * LOAD PRODUCTS
         *************************************************/
        async function loadProducts() {

                const search = document.getElementById("adminSearch").value.trim();
                const typeFilter = document.getElementById("adminTypeFilter").value;
                const langFilter = document.getElementById("adminLanguageFilter").value;

                let query = window.supabaseClient
                    .from("products")
                    .select("*");

                if (currentView === "catalog") {
                    query = query.eq("is_mystery", false);
                } else {
                    query = query.eq("is_mystery", true);
                }

                if (search) {
                    query = query.ilike("name", `%${search}%`);
                }

                if (typeFilter) {
                    query = query.eq("product_type", typeFilter);
                }

                if (langFilter) {
                    query = query.eq("language", langFilter);
                }

                const { data, error } = await query.order("created_at", { ascending: false });

                if (error) {
                    console.error("Errore DB:", error);
                    return;
                }

                const tbody = document.getElementById("productsTable");
                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML =
                        "<tr><td colspan='8'>Nessun prodotto</td></tr>";
                    return;
                }

                data.forEach(p => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
            <td><img src="${p.image || ''}" style="width:40px"></td>
            <td>${p.name}</td>
            <td>€${p.price}</td>
            <td>${p.tcg}</td>
            <td>${p.product_type}</td>
            <td>${p.quantity ?? 0}</td>
            <td>${p.visible ? "✅" : "❌"}</td>
            <td>
                <button onclick="editProduct('${p.id}')">✏️</button>
                <button onclick="deleteProduct('${p.id}')" style="background:#ef4444;color:white;">🗑</button>
            </td>
        `;

                    tbody.appendChild(row);
                });
            }


        async function deleteProduct(id) {
                if (!confirm("Sei sicuro di eliminare questo prodotto?")) return;

                const { error } = await window.supabaseClient
                    .from("products")
                    .delete()
                    .eq("id", id);

                if (error) {
                    console.error(error);
                    alert("Errore eliminazione");
                    return;
                }

                loadProducts();
            }

            async function editProduct(id) {
                const { data, error } = await window.supabaseClient
                    .from("products")
                    .select("*")
                    .eq("id", id)
                    .single();

                if (error) {
                    console.error(error);
                    return;
                }

                document.getElementById("pid").value = data.id;
                document.getElementById("name").value = data.name;
                document.getElementById("price").value = data.price;
                document.getElementById("image").value = data.image;
                document.getElementById("quantity").value = data.quantity;
                document.getElementById("visible").checked = data.visible;
                document.getElementById("description").value = data.description;
                document.getElementById("tcg").value = data.tcg;
                document.getElementById("productType").value = data.product_type;
                document.getElementById("language").value = data.language;

                document.getElementById("modal").style.display = "block";
                updatePreview();
            }

        async function saveProduct() {

                const id = document.getElementById("pid").value;

                const payload = {
                    name: document.getElementById("name").value.trim(),
                    description: document.getElementById("description").value.trim(),
                    tcg: document.getElementById("tcg").value,
                    product_type: document.getElementById("productType").value,
                    language: document.getElementById("language").value,
                    price: parseFloat(document.getElementById("price").value),
                    image: document.getElementById("image").value.trim(),
                    quantity: parseInt(document.getElementById("quantity").value) || 0,
                    visible: document.getElementById("visible").checked,
                    is_mystery: false
                };

                if (!payload.tcg || !payload.product_type || !payload.language) {
                    alert("Compila tutti i campi obbligatori");
                    return;
                }

                let query;

                if (id) {
                    query = window.supabaseClient
                        .from("products")
                        .update(payload)
                        .eq("id", id);
                } else {
                    query = window.supabaseClient
                        .from("products")
                        .insert(payload);
                }

                const { error } = await query;

                if (error) {
                    console.error(error);
                    alert("Errore salvataggio");
                    return;
                }

                closeModal();
                loadProducts();
            }
        
            function updatePreview() {
                    const url = document.getElementById("image").value;
                    const img = document.getElementById("previewImg");

                    if (url) {
                        img.src = url;
                        img.style.display = "block";
                    } else {
                        img.style.display = "none";
                    }
                }

        function openModal() {
                document.getElementById("pid").value = "";
                document.getElementById("modal").style.display = "block";
                document.body.classList.add("modal-open");
            }

        function closeModal() {
                document.getElementById("modal").style.display = "none";
                document.body.classList.remove("modal-open");
            }
        /*************************************************
         * LOGOUT
         *************************************************/
        async function logout() {
            await window.supabaseClient.auth.signOut();
            window.location.href = "admin-login.html";
        }

        const uploadZone = document.getElementById("uploadZone");
            const fileInput = document.getElementById("fileInput");

            uploadZone.addEventListener("click", () => fileInput.click());

            uploadZone.addEventListener("dragover", (e) => {
                e.preventDefault();
                uploadZone.classList.add("dragover");
            });

            uploadZone.addEventListener("dragleave", () => {
                uploadZone.classList.remove("dragover");
            });

            uploadZone.addEventListener("drop", async (e) => {
                e.preventDefault();
                uploadZone.classList.remove("dragover");
                const file = e.dataTransfer.files[0];
                if (file) uploadFile(file);
            });

            fileInput.addEventListener("change", () => {
                if (fileInput.files[0]) {
                    uploadFile(fileInput.files[0]);
                }
            });

            async function uploadFile(file) {

                const fileName = Date.now() + "-" + file.name;

                const { error } = await window.supabaseClient
                    .storage
                    .from("products")
                    .upload(fileName, file);

                if (error) {
                    console.error(error);
                    alert("Errore upload");
                    return;
                }

                const { data } = window.supabaseClient
                    .storage
                    .from("products")
                    .getPublicUrl(fileName);

                document.getElementById("image").value = data.publicUrl;
                updatePreview();
            }
    </script>

    </body>
